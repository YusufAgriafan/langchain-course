[project]
name = "react-search-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YusufAgriafan", email = "yusuf.agung.2205356@students.um.ac.id" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.5.0",
    "langchain-ollama>=1.1.0",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "tavily",
    "tavily-python>=0.8.5",
]

[tool.uv]
package = false

[project.scripts]
react-search-agent = "react_search_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
